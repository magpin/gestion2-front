# En cada pull request a develop o main: lint, tipos, tests y build. Si algo
# falla, la protección de ramas no deja mergear.
name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # La misma versión que fija el Dockerfile.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm exec tsc --noEmit

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://ejemplo.invalid/api/v1
